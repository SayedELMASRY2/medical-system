version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: materna-pgvector
    restart: always
    environment:
      POSTGRES_USER: materna_user
      POSTGRES_PASSWORD: materna_password
      POSTGRES_DB: materna_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: materna-backend
    restart: always
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: materna_user
      POSTGRES_PASSWORD: materna_password
      POSTGRES_DB: materna_db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      COHERE_API_KEY: ${COHERE_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  pgdata:
